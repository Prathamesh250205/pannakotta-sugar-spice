<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PannaKotta – Sugar & Spice</title>
<meta name="description" content="PannaKotta – Sugar & Spice. Café & bakehouse on 7th Lane, Rajarampuri, Kolhapur.">
<script>
  try{const t=localStorage.getItem('pk-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="prefetch" href="home.html">
<style>
:root{
  --bg:#f4ede3; --ink:#2a1d17; --ink-2:#5c4a40; --ink-3:#8c786b;
  --line:rgba(42,29,23,.14);
  --accent:#9c2f45; --accent-ink:#fbf7f1;
  --sh-a:#f4ede3; --sh-b:#ead6c8; --sh-c:#fbf6ee;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15100d; --ink:#efe5d6; --ink-2:#c3b3a1; --ink-3:#8d7c6d;
    --line:rgba(239,229,214,.14);
    --accent:#d9788a; --accent-ink:#15100d;
    --sh-a:#15100d; --sh-b:#2a1a16; --sh-c:#1f1612;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15100d; --ink:#efe5d6; --ink-2:#c3b3a1; --ink-3:#8d7c6d;
  --line:rgba(239,229,214,.14);
  --accent:#d9788a; --accent-ink:#15100d;
  --sh-a:#15100d; --sh-b:#2a1a16; --sh-c:#1f1612;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .5s,color .5s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
#scene.on{opacity:1}

.stage{position:relative;z-index:1;height:100vh;height:100svh;display:grid;grid-template-rows:auto auto 1fr auto;width:min(1180px,100% - 32px);margin-inline:auto}
.top{height:76px;display:flex;align-items:center;justify-content:space-between}
.meta{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);transition:border-color .25s,color .25s}
.icon-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.i-sun{display:none}
[data-mode="dark"] .i-sun{display:block}[data-mode="dark"] .i-moon{display:none}

.title{text-align:center;padding-top:clamp(8px,3vh,32px)}
.title h1{font-family:var(--serif);font-weight:400;font-size:clamp(68px,15vw,220px);line-height:.86;letter-spacing:-.025em}
.title h1 em{font-style:italic;color:var(--accent)}
.title h1 .l{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .08em}
.title h1 .l>span{display:inline-block;transform:translateY(105%);transition:transform 1.4s cubic-bezier(.2,.75,.15,1)}
.title h1 .l:nth-child(2)>span{transition-delay:.12s}
.title p{margin-top:14px;font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.2vw,26px);color:var(--ink-2)}

#slot{position:relative;min-height:220px}

.foot{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 0 34px}
.foot .side{flex:1;font-size:13px;color:var(--ink-3);line-height:1.6}
.foot .side.r{text-align:right}
.foot .side a{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.foot .side a:hover{color:var(--ink)}

.explore{position:relative;display:inline-flex;align-items:center;gap:14px;height:58px;padding:0 12px 0 30px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:500;letter-spacing:.02em;transition:background .3s,color .3s,transform .3s}
.explore:hover{background:var(--accent);color:var(--accent-ink)}
.explore:active{transform:scale(.98)}
.explore i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-style:normal;transition:transform .35s cubic-bezier(.2,.75,.15,1)}
.explore:hover i{transform:translateX(4px)}

.fade{opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease}
.d1{transition-delay:.45s}.d2{transition-delay:.65s}.d3{transition-delay:.8s}
.ready .fade{opacity:1;transform:none}
.ready .title h1 .l>span{transform:none}

/* exit transition to the home page */
.curtain{position:fixed;inset:0;z-index:10;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .6s ease}
.leaving .curtain{opacity:1}

@media (max-width:760px){
  .meta.hide-m{display:none}
  .foot{flex-direction:column;gap:18px;padding-bottom:28px;text-align:center}
  .foot .side,.foot .side.r{text-align:center;flex:none}
  .foot .side.l{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="stage">
  <div class="top">
    <span class="meta fade">Rajarampuri · Kolhapur</span>
    <span class="meta fade hide-m">Café &amp; Bakehouse</span>
    <button class="icon-btn fade" id="theme" aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="title">
    <h1><span class="l"><span>Panna</span></span><span class="l"><span><em>Kotta</em></span></span></h1>
    <p class="fade d1">A little sugar, a little spice.</p>
  </div>

  <div id="slot"></div>

  <div class="foot">
    <div class="side l fade d2">Pizzas · Burritos · Thai bowls<br>Cakes · Pannacotta · Shakes</div>
    <a class="explore fade d2" id="explore" href="home.html">Explore <i>→</i></a>
    <div class="side r fade d3">Order on <a href="https://www.zomato.com/kolhapur/pannakotta-sugar-spice-rajarampuri/order" target="_blank" rel="noopener">Zomato</a> or <a href="https://www.swiggy.com/city/kolhapur/pannakotta-sugar-and-spice-7th-lane-rest96363" target="_blank" rel="noopener">Swiggy</a><br>7th Lane, Rajarampuri</div>
  </div>
</div>
<div class="curtain"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const mode=()=>root.dataset.theme||(mq.matches?'dark':'light');
function syncMode(){root.dataset.mode=mode();document.dispatchEvent(new Event('themechange'))}
document.getElementById('theme').onclick=()=>{root.dataset.theme=mode()==='dark'?'light':'dark';try{localStorage.setItem('pk-theme',root.dataset.theme)}catch(e){}syncMode()};
mq.addEventListener('change',()=>{if(!root.dataset.theme)syncMode()});
syncMode();

let mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1},{passive:true});
requestAnimationFrame(()=>setTimeout(()=>document.body.classList.add('ready'),150));

// fade out, then go to the home page
document.getElementById('explore').addEventListener('click',e=>{
  if(e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();const href=e.currentTarget.href;document.body.classList.add('leaving');
  setTimeout(()=>{location.href=href},550);
});
// coming back with the browser's back button: drop the curtain
addEventListener('pageshow',()=>document.body.classList.remove('leaving'));
</script>
<script src="scene.js"></script>
</body>
</html>
